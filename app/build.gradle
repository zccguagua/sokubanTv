plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sokbantv.game'
    compileSdk 35

    defaultConfig {
        applicationId "com.sokbantv.game"
        minSdk 19
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
